<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cola do professor</title>
<style>
:root{--navy:#0F1B2D;--lar:#FF7A00;--creme:#FFF6E6}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--navy);color:var(--creme);font:14px 'Segoe UI',system-ui,sans-serif}
body{display:grid;grid-template-columns:1fr 300px;grid-template-rows:auto 1fr;gap:10px;padding:10px}
header{grid-column:1/3;display:flex;align-items:center;gap:14px}
header b{font:22px 'Anton',Impact,sans-serif;letter-spacing:.5px;color:var(--lar)}
#nome{opacity:.85;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#pag{font:26px 'Anton',Impact,sans-serif}
#tempo{font:26px 'Anton',Impact,sans-serif;min-width:90px;text-align:right}
#tempo.rec{color:#ff5a5a}
.palco{position:relative;min-height:0;display:flex;align-items:center;justify-content:center}
canvas{background:#fff;border-radius:8px;max-width:100%;max-height:100%;aspect-ratio:16/9;display:block}
#atual{width:100%}
aside{display:flex;flex-direction:column;gap:10px;min-height:0}
aside h4{margin:4px 0 0;font-weight:600;opacity:.75}
#prox{width:100%}
#msg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:30px;font-size:18px;line-height:1.5}
#msg.hide,.hide{display:none!important}
.nav{display:grid;grid-template-columns:1fr 1fr;gap:8px}
button{background:#22324a;color:var(--creme);border:0;border-radius:8px;padding:12px;font-size:16px;cursor:pointer}
button:hover{background:#2d4161}
.aviso{background:#22324a;border-radius:10px;padding:10px;font-size:12px;line-height:1.5;opacity:.9}
.aviso b{color:var(--lar)}
</style>
</head>
<body>
<header><b>COLA DO PROFESSOR</b><span id="nome">–</span><span id="pag">–</span><span id="tempo"></span></header>
<div class="palco">
  <canvas id="atual" width="1920" height="1080"></canvas>
  <div id="msg" class="hide"></div>
</div>
<aside>
  <h4>Próximo slide</h4>
  <canvas id="prox" width="640" height="360"></canvas>
  <div class="nav"><button id="ant">← Anterior</button><button id="seg">Próximo →</button></div>
  <div class="aviso">Esta janela é <b>só sua</b>: não entra na gravação nem no slide dos alunos.<br>
  Arraste-a para o outro monitor (ou deixe atrás do Estúdio). As setas do teclado também passam os slides daqui.<br>
  <b>Não compartilhe esta janela</b> na cena "Tela".</div>
</aside>
<script>
const E = () => (window.opener && !window.opener.closed) ? window.opener.estudioCola : null;
function semEstudio() {
  const m = document.getElementById('msg');
  m.textContent = 'O Estúdio foi fechado. Abra de novo pelo botão "Abrir em outra janela".';
  m.classList.remove('hide');
}
if (E()) E().registrar(window); else semEstudio();
document.getElementById('ant').onclick = () => E()?.anterior();
document.getElementById('seg').onclick = () => E()?.proximo();
addEventListener('keydown', e => {
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  if (['ArrowRight', 'PageDown', ' ', 'ArrowDown'].includes(e.key)) { e.preventDefault(); E()?.proximo(); }
  else if (['ArrowLeft', 'PageUp', 'ArrowUp'].includes(e.key)) { e.preventDefault(); E()?.anterior(); }
});
setInterval(() => { // relógio da gravação, copiado do Estúdio
  const e = E();
  if (!e) return semEstudio();
  const t = document.getElementById('tempo'), s = e.tempo();
  t.textContent = s.texto; t.classList.toggle('rec', s.gravando);
}, 500);
</script>
</body>
</html>
