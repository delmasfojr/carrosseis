# Roteiros do App de Revisão: todo dia às 6 h (Brasília) escreve 3 roteiros de Reels em divulga/roteiros.json.
# Precisa do segredo GEMINI_API_KEY (Settings › Secrets and variables › Actions). Sem ele, não faz nada.
name: Roteiros do app
on:
  schedule:
    - cron: '7 9 * * *'
  workflow_dispatch: {}
permissions:
  contents: write
concurrency: divulga
jobs:
  gerar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node divulga/gerar.mjs
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      - name: Gravar se mudou
        run: |
          git config user.name "roteiros-do-app"
          git config user.email "roteiros-do-app@users.noreply.github.com"
          git add divulga/roteiros.json 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "Roteiros do app: 3 novos" && git pull --rebase && git push)
